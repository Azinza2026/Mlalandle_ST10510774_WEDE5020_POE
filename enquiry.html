<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhattan Sweets - Enquiry</title>
    <link href="style.css" rel="stylesheet" type="text/css"/>
    <script src="script.js" defer></script>
</head>

<body>

<header>
    <h1>Manhattan Sweets</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About Us</a> |
        <a href="products.html">Products</a> |
        <a href="enquiry.html">Enquiry</a> |
        <a href="contact.html">Contact Us</a>
    </nav>

    <hr>
</header>

<main>

    <h2>Product Enquiry</h2>

    <p>
        Complete the form below to enquire about our products.
    </p>

    <!-- Added id="myForm" to link with JavaScript -->
    <form id="myForm" action="#" method="post">

        <label for="customerName">Full Name:</label><br>
        <input type="text" id="customerName" name="name">
        <br>
        <small id="nameError" style="color: red;"></small>
        <br><br>

        <label for="customerEmail">Email Address:</label><br>
        <input type="text" id="customerEmail" name="email">
        <br>
        <small id="emailError" style="color: red;"></small>
        <br><br>

        <label for="customerPhone">Phone Number:</label><br>
        <input type="text" id="customerPhone" name="phone" placeholder="0821234567">
        <br>
        <small id="phoneError" style="color: red;"></small>
        <br><br>

        <label for="product">Select Product:</label><br>
        <select id="product" name="product">
            <option value="">Select a product</option>
            <option value="chocolates">Chocolates</option>
            <option value="lollipops">Lollipops</option>
            <option value="marshmallows">Marshmallows</option>
        </select>
        <br><br>

        <label for="message">Your Enquiry:</label><br>
        <textarea id="messageInput" name="message" rows="6" cols="40"></textarea>
        <br><br>

        <input type="submit" value="Submit Enquiry">
        <input type="reset" value="Clear">

    </form>

    <!-- Success message display area (matches lecture style) -->
    <p id="message" style="color: green; font-weight: bold; margin-top: 15px;"></p>

</main>

<footer>
    <hr>
    <p>&copy; 2026 Manhattan Sweets. All rights reserved.</p>
</footer>

</body>
</html>
